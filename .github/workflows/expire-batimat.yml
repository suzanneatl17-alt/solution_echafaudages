# Redéclenche un build Cloudflare le lendemain de la fin du salon Batimat 2026
# (1er octobre), pour que le bandeau, la bannière d'accueil et la page
# /salon-batimat-2026/ disparaissent automatiquement du site sans action
# manuelle (voir src/lib/batimat.ts pour la date de bascule).
#
# Cloudflare reconstruit le site à chaque push sur main : ce workflow pousse
# simplement un commit vide. Aucun secret à configurer.
# Comme un cron GitHub Actions se répète chaque année, il peut être
# supprimé après le salon 2026 une fois son rôle rempli.
name: Expire Batimat banner

on:
  schedule:
    - cron: '0 3 2 10 *' # 2 octobre, 03:00 UTC (peu après la fin du salon)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push an empty commit to trigger the Cloudflare rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Rebuild : fin du salon Batimat 2026"
          git push
